name: Notify IndexNow after publication
on:
  push:
    branches: [main]
    paths:
      - 'deploy-manifest.json'
      - 'SEVAREL-Consulting-Hosting-*.zip'
      - 'scripts/notify_indexnow.py'
      - '.github/workflows/indexnow.yml'
permissions:
  contents: read
concurrency:
  group: indexnow-main
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/prepare_cloudflare.py
      - run: python3 scripts/check_public_legal.py
      - run: python3 scripts/test_indexnow.py
      - name: Notify after live sitemap and proof validation
        run: python3 scripts/notify_indexnow.py --wait-seconds 360
